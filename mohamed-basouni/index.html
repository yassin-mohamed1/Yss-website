<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محمد بسوني</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 18% 20%,#253c66 0,transparent 40%),linear-gradient(135deg,#080d19,#111b2d 55%,#0a1020);font-family:Tahoma,Arial,sans-serif;color:#fff;overflow:hidden}.glow{position:absolute;width:320px;height:320px;border-radius:50%;background:#4e8cff24;filter:blur(35px);top:12%;right:12%}.card{position:relative;text-align:center;padding:clamp(36px,8vw,84px);border:1px solid #ffffff20;border-radius:32px;background:#ffffff0a;backdrop-filter:blur(16px);box-shadow:0 30px 100px #0006;max-width:90vw}small{display:block;color:#9ebcff;letter-spacing:.22em;font-size:12px;margin-bottom:24px}h1{font-size:clamp(42px,9vw,92px);margin:0;line-height:1.2;letter-spacing:-.04em;background:linear-gradient(110deg,#fff,#a9c8ff);-webkit-background-clip:text;background-clip:text;color:transparent}p{color:#aebbd0;margin:22px 0 0;font-size:15px}.line{width:64px;height:3px;border-radius:9px;background:linear-gradient(90deg,#7daaff,#c6a8ff);margin:28px auto 0}
</style>
</head>
<body><div class="glow"></div><main class="card"><small>WELCOME</small><h1>محمد بسوني</h1><div class="line"></div><p>بداية بسيطة… بطابع مختلف.</p></main></body>
</html>
